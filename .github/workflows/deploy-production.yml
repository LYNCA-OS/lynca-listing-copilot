name: deploy-production

on:
  workflow_dispatch:
    inputs:
      release_class:
        description: Protected release contract
        required: true
        default: ordinary
        type: choice
        options:
          - ordinary
          - compatibility-bridge

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Fail closed unless this dispatch targets the current main commit
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$DEFAULT_BRANCH" = "main"
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          git fetch --no-tags --depth=2 origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$DISPATCH_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Bind the protected release class to this exact commit
        env:
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_CLASS: ${{ inputs.release_class }}
        run: |
          release_receipt="$RUNNER_TEMP/production-release-selection.json"
          umask 077
          node scripts/compatibility-bridge-release.mjs verify-selection \
            --release-class "$RELEASE_CLASS" \
            --git-sha "$DISPATCH_SHA" \
            --out "$release_receipt"
          test "$(stat -c '%a' "$release_receipt")" = "600"
          {
            printf 'PRODUCTION_RELEASE_CLASS=%s\n' "$RELEASE_CLASS"
            printf 'PRODUCTION_RELEASE_SELECTION_RECEIPT=%s\n' "$release_receipt"
          } >> "$GITHUB_ENV"
      - name: Install PostgreSQL 17 from the official PGDG repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
      - name: Require PostgreSQL 17+ for non-skipping persistence tests
        run: |
          pg_bin=/usr/lib/postgresql/17/bin
          for binary in initdb pg_ctl psql postgres; do
            if [ ! -x "$pg_bin/$binary" ]; then
              echo "::error::missing PostgreSQL 17 binary: $binary"
              exit 1
            fi
          done
          if ! "$pg_bin/postgres" --version | grep -Eq '^postgres \(PostgreSQL\) 17\.'; then
            echo "::error::PostgreSQL 17 version check failed"
            exit 1
          fi
          echo "$pg_bin" >> "$GITHUB_PATH"
          echo "PostgreSQL on PATH: $pg_bin"
      - name: Verify the CSM thin release artifact
        run: |
          npm ci --no-audit --no-fund
          npm ls --omit=dev --all
          node scripts/npm-audit-gate.mjs
          npm run check
          npm run test:release
          npm run test:e2e:production-writer-journey:contract
      - name: Verify CSM persistence and global provider authority before deploy
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CSM_PERSISTENCE_ENABLED: "true"
          V4_QUEUE_PUMP_DISABLED: "true"
          ENABLE_RECOGNITION_WORKER: "false"
          ENABLE_PADDLE_OCR_FIELD_VERIFIER: "false"
          ENABLE_VECTOR_RETRIEVAL: "false"
          ENABLE_VISUAL_VECTOR_RETRIEVAL: "false"
          ENABLE_QUERY_VISUAL_VECTOR_PREFLIGHT: "false"
          ENABLE_STORED_VISUAL_FEATURE_LOOKUP: "false"
          DATA_LOOP_PADDLE_OCR_DISPATCH_ENABLED: "false"
          DATA_LOOP_SIDECARS_ENABLED: "false"
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node scripts/check-csm-thin-production-readiness.mjs \
            --database-only \
            --out /tmp/csm-thin-schema-preflight.json
      - name: Re-confirm the exact main commit before building the immutable release
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=2 origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$DISPATCH_SHA"
      - name: Bind the canonical Vercel project from tracked service context
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const context = require('./docs/operations/active-service-context.json');
          const scopeSlug = String(context?.vercel?.scope?.slug || '');
          const orgId = String(context?.vercel?.scope?.id || '');
          const projectId = String(context?.vercel?.production?.project_id || '');
          const projectName = String(context?.vercel?.production?.project || '');
          if (scopeSlug !== 'lyncafei-s-projects'
            || scopeSlug === String(context?.vercel?.forbidden_scope || '')
            || !/^team_[A-Za-z0-9]+$/.test(orgId)
            || !/^prj_[A-Za-z0-9]+$/.test(projectId)
            || projectName !== 'lynca-listing-copilot') process.exit(1);
          process.stdout.write(
            `VERCEL_SCOPE_SLUG=${scopeSlug}\nVERCEL_ORG_ID=${orgId}\nVERCEL_PROJECT_ID=${projectId}\n`
          );
          NODE
      - name: Verify the unique alias writer and capture the current rollback deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          rollback_receipt="$RUNNER_TEMP/vercel-production-rollback-receipt.json"
          umask 077
          node scripts/vercel-production-rollback-receipt.mjs --out "$rollback_receipt"
          test "$(stat -c '%a' "$rollback_receipt")" = "600"
          printf 'VERCEL_ROLLBACK_RECEIPT=%s\n' "$rollback_receipt" >> "$GITHUB_ENV"
      - name: Verify the selected release rollback lineage before candidate creation
        run: |
          test -n "$PRODUCTION_RELEASE_SELECTION_RECEIPT"
          test -n "$VERCEL_ROLLBACK_RECEIPT"
          test "$(stat -c '%a' "$PRODUCTION_RELEASE_SELECTION_RECEIPT")" = "600"
          test "$(stat -c '%a' "$VERCEL_ROLLBACK_RECEIPT")" = "600"
          lineage_receipt="$RUNNER_TEMP/production-release-rollback-lineage.json"
          umask 077
          node scripts/compatibility-bridge-release.mjs verify-rollback-lineage \
            --release-class "$PRODUCTION_RELEASE_CLASS" \
            --git-sha "$GITHUB_SHA" \
            --selection "$PRODUCTION_RELEASE_SELECTION_RECEIPT" \
            --rollback-receipt "$VERCEL_ROLLBACK_RECEIPT" \
            --out "$lineage_receipt"
          test "$(stat -c '%a' "$lineage_receipt")" = "600"
      - name: Build and deploy the exact dispatched checkout
        env:
          DISPATCH_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$OPENAI_API_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$VERCEL_SCOPE_SLUG"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          npx --yes vercel@54.14.5 pull --yes --environment=production \
            --scope "$VERCEL_SCOPE_SLUG"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          npx --yes vercel@54.14.5 build --prod \
            --scope "$VERCEL_SCOPE_SLUG"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          deployment_url="$(npx --yes vercel@54.14.5 deploy --prebuilt --prod --skip-domain --yes \
            --scope "$VERCEL_SCOPE_SLUG" \
            --env "LYNCA_RELEASE_GIT_SHA=$DISPATCH_SHA" \
            --env "LYNCA_RELEASE_GIT_REF=main")"
          DEPLOYMENT_URL="$deployment_url" node -e '
            const raw=process.env.DEPLOYMENT_URL||""; const url=new URL(raw);
            if(raw!==url.origin || !/^[a-z0-9-]+\.vercel\.app$/.test(url.hostname)) process.exit(1);
          '
          export DEPLOYMENT_URL="$deployment_url"
          printf 'DEPLOYMENT_URL=%s\n' "$deployment_url" >> "$GITHUB_ENV"
          node -e 'process.stdout.write(JSON.stringify({mode:"exact_checkout_prebuilt_unpromoted",git_sha:process.env.DISPATCH_SHA,deployment_url:process.env.DEPLOYMENT_URL||null}))' \
            > /tmp/vercel-prebuilt-release.json
      - name: Verify the immutable deployment and prepare candidate-only browser authorization
        env:
          DISPATCH_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$DEPLOYMENT_URL"
          candidate_storage_state="$RUNNER_TEMP/vercel-candidate-storage-state.json"
          {
            printf 'WRITER_JOURNEY_BASE_URL=%s\n' "$DEPLOYMENT_URL"
            printf 'WRITER_JOURNEY_EXPECTED_SHA=%s\n' "$DISPATCH_SHA"
            printf 'WRITER_JOURNEY_INITIAL_STORAGE_STATE=%s\n' "$candidate_storage_state"
          } >> "$GITHUB_ENV"
          umask 077
          node scripts/fetch-vercel-protected-health.mjs \
            --storage-state "$candidate_storage_state" \
            > /tmp/csm-thin-health-prepromotion.json
          test "$(stat -c '%a' "$candidate_storage_state")" = "600"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { CSM_THIN_RUNTIME_CONTRACT } from './lib/listing/thin/csm-runtime-contract.mjs';
          import {
            buildCsmModelExecutionContractSha256,
            csmExecutionContractImageUrls,
            CSM_ACTIVE_MODEL_PROFILE,
            CSM_RECOGNITION_TRANSPORT_PROFILES,
            sha256CsmRecognitionTransportReceipt
          } from './lib/listing/thin/csm-model-execution-contract.mjs';
          import {
            EXTERNAL_IDENTITY_RELEASE_CONTRACT
          } from './lib/listing/knowledge/csm-external-identity-support.mjs';
          import {
            CANONICAL_NAMING_RELEASE_CONTRACT_V2
          } from './lib/listing/thin/canonical-naming-adapter.mjs';
          import {
            VERIFIED_ORIGINAL_OBSERVATION_HEALTH_RECEIPT
          } from './lib/listing/thin/verified-original-observation-support.mjs';
          import {
            CSM_PROJECTION_ACTIVATION
          } from './lib/listing/thin/csm-projection-activation.mjs';
          import { resolveCsmProviderAdapter } from './lib/listing/thin/csm-provider-adapter.mjs';

          const h = JSON.parse(readFileSync('/tmp/csm-thin-health-prepromotion.json', 'utf8'));
          const expectedProviderAdapterVersion = resolveCsmProviderAdapter(
            CSM_ACTIVE_MODEL_PROFILE.provider
          ).contract.id;
          const recognitionTransportContractsReady = CSM_RECOGNITION_TRANSPORT_PROFILES.every(
            (transportProfile) => {
              const lane = transportProfile.lane_version;
              const expectedProfile = {
                ...transportProfile,
                sha256: sha256CsmRecognitionTransportReceipt(transportProfile)
              };
              const actualProfile = h.runtime?.recognition_transport_profiles?.[lane];
              return actualProfile
                && Object.keys(actualProfile).length === Object.keys(expectedProfile).length
                && Object.entries(expectedProfile).every(([key, value]) => actualProfile[key] === value)
                && [1, 2].every((count) => (
                  h.runtime?.execution_contract_sha256_by_transport_lane_and_image_count
                    ?.[lane]?.[String(count)] === buildCsmModelExecutionContractSha256({
                      transportProfile,
                      imageUrls: csmExecutionContractImageUrls(count)
                    })
                ));
            }
          );
          const ok = h.ready === true
            && h.deployment?.git_commit_sha === process.env.DISPATCH_SHA
            && h.active_path === CSM_THIN_RUNTIME_CONTRACT.route
            && h.model === CSM_THIN_RUNTIME_CONTRACT.model
            && h.reasoning_effort === CSM_THIN_RUNTIME_CONTRACT.reasoningEffort
            && h.runtime?.model_profile_id === CSM_ACTIVE_MODEL_PROFILE.id
            && h.runtime?.provider_adapter_version === expectedProviderAdapterVersion
            && recognitionTransportContractsReady
            && JSON.stringify(h.runtime?.external_identity)
              === JSON.stringify(EXTERNAL_IDENTITY_RELEASE_CONTRACT)
            && JSON.stringify(h.runtime?.canonical_naming_target)
              === JSON.stringify(CANONICAL_NAMING_RELEASE_CONTRACT_V2)
            && JSON.stringify(h.runtime?.verified_original_observation)
              === JSON.stringify(VERIFIED_ORIGINAL_OBSERVATION_HEALTH_RECEIPT)
            && JSON.stringify(h.runtime?.projection_activation)
              === JSON.stringify(CSM_PROJECTION_ACTIVATION)
            && JSON.stringify(h.runtime?.active_writer)
              === JSON.stringify(CSM_PROJECTION_ACTIVATION.active_writer)
            && JSON.stringify(h.runtime?.forward_readers)
              === JSON.stringify(CSM_PROJECTION_ACTIVATION.forward_readers)
            && h.runtime?.max_output_tokens === CSM_ACTIVE_MODEL_PROFILE.max_output_tokens
            && h.runtime?.retired_capabilities_disabled === true;
          process.exit(ok ? 0 : 1);
          NODE
      - name: Prove the selected compatibility bridge runtime contract
        if: ${{ inputs.release_class == 'compatibility-bridge' }}
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          node scripts/compatibility-bridge-release.mjs verify-health \
            --release-class "$PRODUCTION_RELEASE_CLASS" \
            --git-sha "$DISPATCH_SHA" \
            --health /tmp/csm-thin-health-prepromotion.json \
            --out /tmp/compatibility-bridge-contract.json
          test "$(stat -c '%a' /tmp/compatibility-bridge-contract.json)" = "600"
      - name: Install the pinned browser for the candidate Writer Journey
        run: npx playwright install --with-deps chromium
      - name: Materialize release-class-bound Writer Journey cases from Production Storage
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          source_dir="$RUNNER_TEMP/writer-journey-source"
          canonical_cases_manifest="$RUNNER_TEMP/writer-journey-cases-v3.json"
          bridge_cases_manifest="$RUNNER_TEMP/writer-journey-compatibility-bridge-cases-v1.json"
          large_source_manifest="$RUNNER_TEMP/writer-journey-large-source-v2.json"
          forward_readback_expectation="$RUNNER_TEMP/production-forward-readback-expectation.json"
          umask 077
          node scripts/materialize-writer-journey-source.mjs --out-dir "$source_dir" \
            > "$canonical_cases_manifest"
          CASES_MANIFEST="$canonical_cases_manifest" LARGE_SOURCE_MANIFEST="$large_source_manifest" \
            node --input-type=module <<'NODE'
          import { readFile, stat, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import {
            WRITER_JOURNEY_EXACT_PARITY_SOURCE_CONTRACT,
            WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT
          } from './scripts/materialize-writer-journey-source.mjs';

          const sourcePath = process.env.CASES_MANIFEST;
          const largeSourcePath = process.env.LARGE_SOURCE_MANIFEST;
          const manifest = JSON.parse(await readFile(sourcePath, 'utf8'));
          const exactKeys = (value, keys) => value && typeof value === 'object'
            && !Array.isArray(value)
            && JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort());
          const contract = WRITER_JOURNEY_EXACT_PARITY_SOURCE_CONTRACT;
          const parity = manifest.parity_case;
          const standard = manifest.cases?.find((entry) => entry?.case_id === 'NON_TCG');
          const validParityFiles = Array.isArray(parity?.files)
            && parity.files.length === 2
            && parity.files.every((file, index) => (
              exactKeys(file, ['path', 'role', 'bytes', 'content_type', 'content_sha256'])
              && path.isAbsolute(file.path)
              && file.role === contract.images[index].role
              && file.content_sha256 === contract.images[index].content_sha256
              && Number.isSafeInteger(file.bytes) && file.bytes > 0
              && ['image/jpeg', 'image/png', 'image/webp'].includes(file.content_type)
            ));
          const validStandardFiles = Array.isArray(standard?.files)
            && standard.files.length === 2
            && standard.files.every((file, index) => (
              exactKeys(file, ['path', 'role', 'bytes', 'content_type', 'content_sha256'])
              && path.isAbsolute(file.path)
              && file.role === WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.images[index].role
              && file.content_type
                === WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.images[index].content_type
              && file.bytes === WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.images[index].bytes
              && file.content_sha256
                === WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.images[index].content_sha256
            ));
          if (!exactKeys(manifest, [
            'schema_version', 'evidence_scope', 'accuracy_claim', 'cases', 'parity_case'
          ])
            || manifest.schema_version !== 'writer-journey-cases-v3'
            || manifest.evidence_scope !== 'LIVE_CONTRACT_RECEIPT_ONLY'
            || manifest.accuracy_claim !== null
            || !Array.isArray(manifest.cases) || manifest.cases.length !== 2
            || !exactKeys(standard, [
              'case_id', 'expected_grammar', 'source_kind', 'source_record_id',
              'source_asset_id', 'evaluation_cohort', 'hash_provenance', 'image_count', 'files'
            ])
            || standard.expected_grammar
              !== WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.expected_grammar
            || standard.source_kind !== WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.source_kind
            || standard.source_record_id
              !== WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.source_record_id
            || standard.source_asset_id
              !== WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.source_asset_id
            || standard.evaluation_cohort
              !== WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.evaluation_cohort
            || standard.hash_provenance
              !== WRITER_JOURNEY_STANDARD_P0_SOURCE_CONTRACT.hash_provenance
            || standard.image_count !== 2
            || !validStandardFiles
            || !exactKeys(parity, [
              'case_id', 'expected_grammar', 'source_kind', 'source_record_id',
              'source_asset_id', 'evaluation_cohort', 'hash_provenance', 'image_count', 'files'
            ])
            || parity.case_id !== contract.case_id
            || parity.expected_grammar !== contract.expected_grammar
            || parity.source_kind !== contract.source_kind
            || parity.source_record_id !== contract.source_record_id
            || parity.source_asset_id !== contract.source_asset_id
            || parity.evaluation_cohort !== contract.evaluation_cohort
            || parity.hash_provenance !== contract.hash_provenance
            || parity.image_count !== 2
            || !validParityFiles
            || ((await stat(sourcePath)).mode & 0o077) !== 0) {
            throw new Error('writer_journey_cases_v3_invalid');
          }
          const v2 = {
            schema_version: 'writer-journey-cases-v2',
            evidence_scope: manifest.evidence_scope,
            accuracy_claim: null,
            cases: manifest.cases
          };
          if (/"(?:expected_card_number|expected_serial|card_number|serial|title)"/.test(
            JSON.stringify(v2)
          )) {
            throw new Error('writer_journey_verifier_fact_leaked');
          }
          await writeFile(largeSourcePath, `${JSON.stringify(v2)}\n`, {
            flag: 'wx', mode: 0o600
          });
          if (((await stat(largeSourcePath)).mode & 0o777) !== 0o600) {
            throw new Error('writer_journey_large_source_permissions_invalid');
          }
          NODE
          selected_cases_manifest="$canonical_cases_manifest"
          if [ "$PRODUCTION_RELEASE_CLASS" = "compatibility-bridge" ]; then
            node scripts/compatibility-bridge-release.mjs build-manifest \
              --release-class "$PRODUCTION_RELEASE_CLASS" \
              --git-sha "$GITHUB_SHA" \
              --source-manifest "$canonical_cases_manifest" \
              --out "$bridge_cases_manifest"
            test "$(stat -c '%a' "$bridge_cases_manifest")" = "600"
            selected_cases_manifest="$bridge_cases_manifest"
          else
            test "$PRODUCTION_RELEASE_CLASS" = "ordinary"
          fi
          {
            printf 'WRITER_JOURNEY_RELEASE_CLASS=%s\n' "$PRODUCTION_RELEASE_CLASS"
            printf 'WRITER_JOURNEY_CASES_MANIFEST=%s\n' "$selected_cases_manifest"
            printf 'WRITER_JOURNEY_LARGE_SOURCE_MANIFEST=%s\n' "$large_source_manifest"
            printf 'WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION=%s\n' "$forward_readback_expectation"
          } >> "$GITHUB_ENV"
      - name: Build executor-bound large staged transport fixture
        run: |
          fixture_parent="$RUNNER_TEMP/lynca-large-writer-fixture"
          fixture_dir="$fixture_parent/bundle"
          install -d -m 700 "$fixture_parent"
          node scripts/build-large-internal-writer-fixture.mjs \
            --source-manifest "$WRITER_JOURNEY_LARGE_SOURCE_MANIFEST" \
            --out-dir "$fixture_dir" >/dev/null
          test -f "$fixture_dir/receipt.json"
          printf 'WRITER_JOURNEY_LARGE_FIXTURE_RECEIPT=%s\n' "$fixture_dir/receipt.json" >> "$GITHUB_ENV"
      - name: Run real candidate Writer Journey before production promotion
        env:
          METAVERSE_USERNAME: ${{ secrets.METAVERSE_USERNAME }}
          METAVERSE_PASSWORD: ${{ secrets.METAVERSE_PASSWORD }}
        run: |
          test -n "$METAVERSE_USERNAME"
          test -n "$METAVERSE_PASSWORD"
          npm run test:e2e:production-writer-journey
          test -n "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION"
          test "$(stat -c '%a' "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION")" = "600"
      - name: Destroy candidate browser authorization
        if: always()
        run: |
          if [ -n "${WRITER_JOURNEY_INITIAL_STORAGE_STATE:-}" ]; then
            case "$WRITER_JOURNEY_INITIAL_STORAGE_STATE" in
              "$RUNNER_TEMP"/*) ;;
              *) exit 1 ;;
            esac
            rm -f -- "$WRITER_JOURNEY_INITIAL_STORAGE_STATE"
          fi
      - name: Prove captured Production can read the candidate durable projection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          METAVERSE_USERNAME: ${{ secrets.METAVERSE_USERNAME }}
          METAVERSE_PASSWORD: ${{ secrets.METAVERSE_PASSWORD }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$METAVERSE_USERNAME"
          test -n "$METAVERSE_PASSWORD"
          test -n "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION"
          test "$(stat -c '%a' "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION")" = "600"
          writer_evidence="$GITHUB_WORKSPACE/artifacts/production-writer-journey/evidence.json"
          cookie_jar="$RUNNER_TEMP/lynca-canonical-forward-readback-cookies.txt"
          login_response="$RUNNER_TEMP/production-forward-readback-login.json"
          readback_response="$RUNNER_TEMP/production-forward-readback-response.json"
          readback_receipt="$RUNNER_TEMP/production-forward-readback-receipt.json"
          trap 'rm -f -- "$cookie_jar" "$login_response" "$readback_response"' EXIT
          umask 077
          node scripts/vercel-production-rollback-receipt.mjs \
            --verify-canonical "$VERCEL_ROLLBACK_RECEIPT"
          asset_id="$(node scripts/production-forward-readback.mjs asset-id \
            --evidence "$writer_evidence" \
            --expectation "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION" \
            --deployment-url "$DEPLOYMENT_URL" \
            --git-sha "$GITHUB_SHA")"
          query="$(ASSET_ID="$asset_id" node -e \
            'process.stdout.write(new URLSearchParams({asset_id:process.env.ASSET_ID}).toString())')"
          login_url="https://listing.lyncafei.team/api/login"
          install -m 600 /dev/null "$login_response"
          mapfile -t login_meta < <(
            node -e 'process.stdout.write(JSON.stringify({username:process.env.METAVERSE_USERNAME,password:process.env.METAVERSE_PASSWORD}))' \
            | curl -sS --max-time 30 --max-redirs 0 -c "$cookie_jar" \
              -H 'content-type: application/json' --data-binary @- \
              -o "$login_response" -w '%{http_code}\n%{url_effective}\n' "$login_url"
          )
          test "${login_meta[0]}" = "200"
          test "${login_meta[1]}" = "$login_url"
          test "$(stat -c '%a' "$cookie_jar")" = "600"
          readback_url="https://listing.lyncafei.team/api/csm-resolution-view?$query"
          install -m 600 /dev/null "$readback_response"
          mapfile -t readback_meta < <(
            curl -sS --max-time 30 --max-redirs 0 -b "$cookie_jar" \
              -o "$readback_response" -w '%{http_code}\n%{url_effective}\n' "$readback_url"
          )
          test "${readback_meta[0]}" = "200"
          test "${readback_meta[1]}" = "$readback_url"
          test "$(stat -c '%a' "$readback_response")" = "600"
          node scripts/production-forward-readback.mjs verify \
            --evidence "$writer_evidence" \
            --expectation "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION" \
            --readback "$readback_response" \
            --response-url "${readback_meta[1]}" \
            --deployment-url "$DEPLOYMENT_URL" \
            --git-sha "$GITHUB_SHA" \
            --rollback-receipt "$VERCEL_ROLLBACK_RECEIPT" \
            --out "$readback_receipt"
          test "$(stat -c '%a' "$readback_receipt")" = "600"
          node scripts/vercel-production-rollback-receipt.mjs \
            --verify-canonical "$VERCEL_ROLLBACK_RECEIPT"
      - name: Re-verify single-writer authority and canonical ownership before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ROLLBACK_RECEIPT"
          case "$VERCEL_ROLLBACK_RECEIPT" in
            "$RUNNER_TEMP"/*) ;;
            *) exit 1 ;;
          esac
          test "$(stat -c '%a' "$VERCEL_ROLLBACK_RECEIPT")" = "600"
          # Vercel exposes no conditional promotion API. Normal Production
          # writes therefore belong exclusively to this protected workflow.
          # Fail closed if the staged-only project contract or canonical owner
          # changed while the candidate Writer Journey was running.
          node scripts/vercel-production-rollback-receipt.mjs \
            --verify-writer-authority
          node scripts/vercel-production-rollback-receipt.mjs \
            --verify-canonical "$VERCEL_ROLLBACK_RECEIPT"
      - name: Promote the verified immutable deployment to production
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$DEPLOYMENT_URL"
          npx --yes vercel@54.14.5 promote "$DEPLOYMENT_URL" --yes \
            --scope "$VERCEL_SCOPE_SLUG"
      - name: Wait for the exact CSM thin main commit to reach production
        run: |
          for _attempt in $(seq 1 60); do
            if curl -fsS --max-time 30 https://listing.lyncafei.team/api/health \
              -o /tmp/csm-thin-health.json \
              && node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const h = JSON.parse(readFileSync('/tmp/csm-thin-health.json', 'utf8'));
          const ok = h.ready === true
            && h.deployment?.git_commit_sha === process.env.GITHUB_SHA;
          process.exit(ok ? 0 : 1);
          NODE
            then
              break
            fi
            rm -f /tmp/csm-thin-health.json
            sleep 10
          done
          test -s /tmp/csm-thin-health.json
      - name: Bind the canonical alias to the exact promoted deployment URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$DEPLOYMENT_URL"
          canonical_receipt="$RUNNER_TEMP/vercel-production-canonical-deployment-receipt.json"
          umask 077
          node scripts/vercel-production-rollback-receipt.mjs \
            --canonical-deployment-receipt "$DEPLOYMENT_URL" \
            --out "$canonical_receipt"
          test "$(stat -c '%a' "$canonical_receipt")" = "600"
      - name: Re-verify CSM persistence after deployment
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CSM_PERSISTENCE_ENABLED: "true"
          V4_QUEUE_PUMP_DISABLED: "true"
          ENABLE_RECOGNITION_WORKER: "false"
          ENABLE_PADDLE_OCR_FIELD_VERIFIER: "false"
          ENABLE_VECTOR_RETRIEVAL: "false"
          ENABLE_VISUAL_VECTOR_RETRIEVAL: "false"
          ENABLE_QUERY_VISUAL_VECTOR_PREFLIGHT: "false"
          ENABLE_STORED_VISUAL_FEATURE_LOOKUP: "false"
          DATA_LOOP_PADDLE_OCR_DISPATCH_ENABLED: "false"
          DATA_LOOP_SIDECARS_ENABLED: "false"
        run: |
          node scripts/check-csm-thin-production-readiness.mjs \
            --database-only \
            --out /tmp/csm-thin-schema-postdeploy.json
      - name: Verify authenticated UI, active API, and retired boundaries
        env:
          METAVERSE_USERNAME: ${{ secrets.METAVERSE_USERNAME }}
          METAVERSE_PASSWORD: ${{ secrets.METAVERSE_PASSWORD }}
        run: |
          test -n "$METAVERSE_USERNAME"
          test -n "$METAVERSE_PASSWORD"
          cookie_jar="$RUNNER_TEMP/lynca-production-cookies.txt"
          parity_response="$RUNNER_TEMP/production-parity-resolution-view.json"
          parity_receipt="$RUNNER_TEMP/production-parity-readback-receipt.json"
          standard_response="$RUNNER_TEMP/production-standard-resolution-view.json"
          standard_receipt="$RUNNER_TEMP/production-standard-readback-receipt.json"
          bridge_response="$RUNNER_TEMP/production-bridge-forward-readback-response.json"
          bridge_receipt="$RUNNER_TEMP/production-bridge-forward-readback-receipt.json"
          trap 'rm -f -- "$cookie_jar" "$parity_response" "$standard_response" "$bridge_response" "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION"' EXIT
          umask 077
          node -e 'process.stdout.write(JSON.stringify({username:process.env.METAVERSE_USERNAME,password:process.env.METAVERSE_PASSWORD}))' \
          | curl -fsS --max-time 30 -c "$cookie_jar" \
            -H 'content-type: application/json' \
            --data-binary @- \
            https://listing.lyncafei.team/api/login -o /tmp/login.json
          test "$(stat -c '%a' "$cookie_jar")" = "600"
          curl -fsS --max-time 30 -b "$cookie_jar" \
            https://listing.lyncafei.team/app/listing-copilot.js \
            -o /tmp/listing-copilot.js
          grep -q '"/api/csm-listing-title"' /tmp/listing-copilot.js
          test "$(curl -sS --max-time 30 -o /tmp/retired-route.json -w '%{http_code}' \
            -X POST https://listing.lyncafei.team/api/v4/listing-job-enqueue)" = "410"
          node -e 'const r=require("/tmp/retired-route.json"); if(r.error_code!=="RETIRED_LISTING_EXECUTION_PATH") process.exit(1)'
          test "$(curl -sS --max-time 30 -o /tmp/csm-noop.json -w '%{http_code}' \
            -b "$cookie_jar" -H 'content-type: application/json' \
            --data '{}' https://listing.lyncafei.team/api/csm-listing-title)" = "400"
          node -e 'const r=require("/tmp/csm-noop.json"); if(r.code!=="missing_asset_id") process.exit(1)'
          writer_evidence="$GITHUB_WORKSPACE/artifacts/production-writer-journey/evidence.json"
          if [ "$PRODUCTION_RELEASE_CLASS" = "ordinary" ]; then
          parity_asset_id="$(node scripts/production-parity-readback.mjs asset-id \
            --evidence "$writer_evidence" \
            --deployment-url "$DEPLOYMENT_URL" \
            --git-sha "$GITHUB_SHA")"
          parity_query="$(ASSET_ID="$parity_asset_id" node -e \
            'process.stdout.write(new URLSearchParams({asset_id:process.env.ASSET_ID}).toString())')"
          install -m 600 /dev/null "$parity_response"
          curl -fsS --max-time 30 -b "$cookie_jar" \
            "https://listing.lyncafei.team/api/csm-resolution-view?$parity_query" \
            -o "$parity_response"
          test "$(stat -c '%a' "$parity_response")" = "600"
          node scripts/production-parity-readback.mjs verify \
            --evidence "$writer_evidence" \
            --readback "$parity_response" \
            --deployment-url "$DEPLOYMENT_URL" \
            --git-sha "$GITHUB_SHA" \
            --out "$parity_receipt"
          test "$(stat -c '%a' "$parity_receipt")" = "600"
          standard_asset_id="$(node scripts/production-parity-readback.mjs standard-asset-id \
            --evidence "$writer_evidence" \
            --deployment-url "$DEPLOYMENT_URL" \
            --git-sha "$GITHUB_SHA")"
          standard_query="$(ASSET_ID="$standard_asset_id" node -e \
            'process.stdout.write(new URLSearchParams({asset_id:process.env.ASSET_ID}).toString())')"
          install -m 600 /dev/null "$standard_response"
          curl -fsS --max-time 30 -b "$cookie_jar" \
            "https://listing.lyncafei.team/api/csm-resolution-view?$standard_query" \
            -o "$standard_response"
          test "$(stat -c '%a' "$standard_response")" = "600"
          node scripts/production-parity-readback.mjs verify-standard \
            --evidence "$writer_evidence" \
            --readback "$standard_response" \
            --deployment-url "$DEPLOYMENT_URL" \
            --git-sha "$GITHUB_SHA" \
            --out "$standard_receipt"
          test "$(stat -c '%a' "$standard_receipt")" = "600"
          else
            test "$PRODUCTION_RELEASE_CLASS" = "compatibility-bridge"
            test "$(stat -c '%a' "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION")" = "600"
            bridge_asset_id="$(node scripts/production-forward-readback.mjs asset-id \
              --evidence "$writer_evidence" \
              --expectation "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION" \
              --deployment-url "$DEPLOYMENT_URL" \
              --git-sha "$GITHUB_SHA")"
            bridge_query="$(ASSET_ID="$bridge_asset_id" node -e \
              'process.stdout.write(new URLSearchParams({asset_id:process.env.ASSET_ID}).toString())')"
            bridge_url="https://listing.lyncafei.team/api/csm-resolution-view?$bridge_query"
            install -m 600 /dev/null "$bridge_response"
            mapfile -t bridge_meta < <(
              curl -sS --max-time 30 --max-redirs 0 -b "$cookie_jar" \
                -o "$bridge_response" -w '%{http_code}\n%{url_effective}\n' "$bridge_url"
            )
            test "${bridge_meta[0]}" = "200"
            test "${bridge_meta[1]}" = "$bridge_url"
            node scripts/production-forward-readback.mjs verify-promoted \
              --evidence "$writer_evidence" \
              --expectation "$WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION" \
              --readback "$bridge_response" \
              --response-url "${bridge_meta[1]}" \
              --deployment-url "$DEPLOYMENT_URL" \
              --git-sha "$GITHUB_SHA" \
              --out "$bridge_receipt"
            test "$(stat -c '%a' "$bridge_receipt")" = "600"
          fi
      - name: Re-confirm the exact canonical deployment after parity readback
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$DEPLOYMENT_URL"
          node scripts/vercel-production-rollback-receipt.mjs \
            --verify-canonical-deployment "$DEPLOYMENT_URL"
      - name: Restore the saved Production deployment after release verification failure
        if: failure() && (steps.promote.outcome == 'success' || steps.promote.outcome == 'failure')
        timeout-minutes: 12
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ROLLBACK_RECEIPT"
          case "$VERCEL_ROLLBACK_RECEIPT" in
            "$RUNNER_TEMP"/*) ;;
            *) exit 1 ;;
          esac
          test "$(stat -c '%a' "$VERCEL_ROLLBACK_RECEIPT")" = "600"
          # Roll back only while this single writer still owns the alias.
          # A Vercel OWNER break-glass action invalidates automatic rollback.
          node scripts/vercel-production-rollback-receipt.mjs \
            --verify-writer-authority
          node scripts/vercel-production-rollback-receipt.mjs \
            --verify-canonical-deployment "$DEPLOYMENT_URL"
          node scripts/vercel-production-rollback-receipt.mjs \
            --verify-deployment "$VERCEL_ROLLBACK_RECEIPT"
          rollback_url="$(node scripts/vercel-production-rollback-receipt.mjs \
            --deployment-url "$VERCEL_ROLLBACK_RECEIPT")"
          rollback_sha="$(node scripts/vercel-production-rollback-receipt.mjs \
            --git-sha "$VERCEL_ROLLBACK_RECEIPT")"
          npx --yes vercel@54.14.5 promote "$rollback_url" --yes \
            --scope "$VERCEL_SCOPE_SLUG"
          for _attempt in $(seq 1 60); do
            if curl -fsS --max-time 30 https://listing.lyncafei.team/api/health \
              -o /tmp/csm-thin-health-rollback.json \
              && ROLLBACK_SHA="$rollback_sha" node -e '
                const h=require("/tmp/csm-thin-health-rollback.json");
                if(h.ready!==true||h.deployment?.git_commit_sha!==process.env.ROLLBACK_SHA)process.exit(1)
              ' \
              && node scripts/vercel-production-rollback-receipt.mjs \
                --verify-canonical "$VERCEL_ROLLBACK_RECEIPT"
            then
              touch /tmp/vercel-production-rollback-verified
              break
            fi
            rm -f /tmp/csm-thin-health-rollback.json
            sleep 10
          done
          test -f /tmp/vercel-production-rollback-verified
          echo "::error::Production release verification failed; the saved deployment was restored and this release remains HOLD."
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-release-evidence
          path: |
            /tmp/csm-thin-schema-preflight.json
            /tmp/csm-thin-schema-postdeploy.json
            /tmp/csm-thin-health-prepromotion.json
            /tmp/compatibility-bridge-contract.json
            /tmp/csm-thin-health.json
            /tmp/csm-thin-health-rollback.json
            /tmp/vercel-prebuilt-release.json
            /tmp/retired-route.json
            /tmp/csm-noop.json
            ${{ runner.temp }}/vercel-production-rollback-receipt.json
            ${{ runner.temp }}/production-release-rollback-lineage.json
            ${{ runner.temp }}/production-release-selection.json
            ${{ runner.temp }}/production-forward-readback-receipt.json
            ${{ runner.temp }}/vercel-production-canonical-deployment-receipt.json
            ${{ runner.temp }}/production-parity-readback-receipt.json
            ${{ runner.temp }}/production-standard-readback-receipt.json
            ${{ runner.temp }}/production-bridge-forward-readback-receipt.json
            ${{ runner.temp }}/writer-journey-compatibility-bridge-cases-v1.json
            artifacts/production-writer-journey/evidence.json
