name: apply-writer-feedback-asset-identity-fix

on:
  workflow_dispatch:

concurrency:
  group: production-database-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Require the exact current main commit
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          test "$DISPATCH_REF" = "refs/heads/main"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$DISPATCH_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node scripts/writer-feedback-asset-identity-migration.test.mjs
      - name: Apply one bounded production repair transaction
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: node scripts/apply-writer-feedback-asset-identity-fix.mjs
