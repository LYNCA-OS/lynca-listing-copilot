name: targeted-assist-paired20

on:
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: "Exact production SHA required before paid calls"
        required: true
        type: string

concurrency:
  group: targeted-assist-paired20
  cancel-in-progress: false

jobs:
  paired-20:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      API_BASE_URL: https://listing.lyncafei.team
      METAVERSE_USERNAME: ${{ secrets.METAVERSE_USERNAME }}
      METAVERSE_PASSWORD: ${{ secrets.METAVERSE_PASSWORD }}
      LAUNCH_GATE_EVAL_SECRET: ${{ secrets.LAUNCH_GATE_EVAL_SECRET }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
      FAMILIAR_ITEM_SET_SHA256: e280a121c50060918fbc0ea3ba27f755d3c8421f2db66a49cdeccb467253fefe
      UNSEEN_ITEM_SET_SHA256: 6f27384f23163f6e40c544271ff01575272fcd4b9c42080408bc866e652b6300
      FAMILIAR_LABELS_SHA256: 21b094c004a1f25ef5c15a6c62720c8f33a04ec472d91e00d63d797fb2db3599
      UNSEEN_LABELS_SHA256: b105810bc7dc94bfddb2469d54edb51cc9a4dce7d2f58f8b4a8bfef80d3cb74f
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_git_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact checked-out production revision
        run: |
          test -n "$METAVERSE_USERNAME"
          test -n "$METAVERSE_PASSWORD"
          test -n "$LAUNCH_GATE_EVAL_SECRET"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$EXPECTED_GIT_SHA"
          checked_out_git_sha="$(git rev-parse HEAD)"
          actual_git_sha="$(curl --fail --silent --show-error "$API_BASE_URL/api/v4/health" | jq -r '.deployment.git_commit_sha // empty')"
          test "$checked_out_git_sha" = "$EXPECTED_GIT_SHA"
          test "$actual_git_sha" = "$EXPECTED_GIT_SHA"
      - name: Verify Recognition Worker service/auth/route contract
        run: |
          curl -fsS --max-time 30 -c /tmp/lynca-cookies.txt \
            -H 'content-type: application/json' \
            --data "$(node -e 'process.stdout.write(JSON.stringify({username:process.env.METAVERSE_USERNAME,password:process.env.METAVERSE_PASSWORD}))')" \
            "$API_BASE_URL/api/login" -o /tmp/login.json
          curl -fsS --max-time 30 -b /tmp/lynca-cookies.txt \
            "$API_BASE_URL/api/listing-provider-status" \
            -o /tmp/recognition-worker-service-contract.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { recognitionPipelineVersion } from './lib/listing/recognition/recognition-contract.mjs';
          const status = JSON.parse(fs.readFileSync('/tmp/recognition-worker-service-contract.json', 'utf8'));
          const worker = status.execution_control?.recognition_worker || {};
          const checks = {
            service_contract_ready: worker.service_contract_ready === true,
            service_contract_scope: worker.service_contract_scope === 'SERVICE_AUTH_ROUTE_ONLY',
            pipeline_contract_matches: worker.pipeline_contract_matches === true,
            auth_verified: worker.auth_verified === true,
            analysis_route_verified: worker.analysis_route_verified === true,
            pipeline_version: worker.pipeline_version === recognitionPipelineVersion,
            service_role: worker.service_role === 'RECOGNITION_WORKER'
          };
          console.log(JSON.stringify({ checks, reason: worker.reason || null }, null, 2));
          if (Object.values(checks).some((value) => value !== true)) process.exit(1);
          NODE
      - name: Build frozen familiar development cohort
        run: |
          node scripts/build-reviewed-title-blind-eval.mjs \
            --source data/catalog/vector-seed/feedback-writer-gt-seed-dataset.json \
            --out /tmp/familiar10.json \
            --sealed-labels-out /tmp/familiar10-labels.jsonl \
            --limit 10 \
            --selection-seed world-knowledge-paired20-v1 \
            --sample-mode PAIRED_ABLATION \
            --reuse-reason "Frozen familiar development cohort for Targeted Visual ablation." \
            --reuse-scope-id world-knowledge-paired20-familiar-v1 \
            --evaluation-partition development
      - name: Materialize frozen unseen development cohort
        run: |
          node scripts/materialize-paired-ablation-cohort.mjs \
            --dataset data/eval/unseen-product/unseen17.json \
            --labels data/eval/unseen-product/unseen17-labels.jsonl \
            --out /tmp/unseen10.json \
            --labels-out /tmp/unseen10-labels.jsonl \
            --limit 10 \
            --reuse-reason "Frozen unseen development cohort for Targeted Visual ablation." \
            --reuse-scope-id targeted-assist-paired20-unseen-v1 \
            --evaluation-partition development
          cp data/eval/unseen-product/unseen17-verified-assets.json /tmp/targeted-assist-assets.json
      - name: Verify frozen 10 plus 10 cohort fingerprints
        run: |
          node --input-type=module - <<'NODE'
          import { assertFrozenTargetedAssistPaired20 } from './scripts/run-targeted-assist-paired-eval.mjs';
          const verified = await assertFrozenTargetedAssistPaired20({
            familiarDataset: '/tmp/familiar10.json',
            familiarLabels: '/tmp/familiar10-labels.jsonl',
            unseenDataset: '/tmp/unseen10.json',
            unseenLabels: '/tmp/unseen10-labels.jsonl',
            familiarSha256: process.env.FAMILIAR_ITEM_SET_SHA256,
            unseenSha256: process.env.UNSEEN_ITEM_SET_SHA256,
            familiarLabelsSha256: process.env.FAMILIAR_LABELS_SHA256,
            unseenLabelsSha256: process.env.UNSEEN_LABELS_SHA256
          });
          console.log(JSON.stringify(verified, null, 2));
          NODE
      - name: Prepare and canonically verify all 20 assets
        run: |
          node scripts/materialize-targeted-assist-verified-assets.mjs \
            --base-url "$API_BASE_URL" \
            --familiar-dataset /tmp/familiar10.json \
            --unseen-dataset /tmp/unseen10.json \
            --verified-asset-cache /tmp/targeted-assist-assets.json \
            --source-materialization-dir /tmp/targeted-assist-source-images \
            --report /tmp/targeted-assist-asset-preparation.json
          jq -e '
            .prepared_item_count == 20 and
            .verified_cache_entry_count == 20 and
            .zero_enqueue_or_provider_calls == true and
            .all_assets_uploaded_and_canonically_verified == true
          ' /tmp/targeted-assist-asset-preparation.json >/dev/null
      - name: Consume this deployment SHA for one paired evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          consumption_ref="refs/tags/eval-targeted-assist-paired-${EXPECTED_GIT_SHA}"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="$consumption_ref" \
            -f sha="$EXPECTED_GIT_SHA" \
            > /tmp/targeted-assist-paired-consumption.json
          jq -e \
            --arg ref "$consumption_ref" \
            --arg sha "$EXPECTED_GIT_SHA" \
            '.ref == $ref and .object.sha == $sha' \
            /tmp/targeted-assist-paired-consumption.json >/dev/null
      - name: Run familiar and unseen paired scoreboards
        run: |
          node scripts/run-targeted-assist-paired-eval.mjs \
            --baseline-url "$API_BASE_URL" \
            --candidate-url "$API_BASE_URL" \
            --familiar-dataset /tmp/familiar10.json \
            --familiar-labels /tmp/familiar10-labels.jsonl \
            --unseen-dataset /tmp/unseen10.json \
            --unseen-labels /tmp/unseen10-labels.jsonl \
            --verified-asset-cache /tmp/targeted-assist-assets.json \
            --limit-per-cohort 10 \
            --l2-wait-ms 360000 \
            --model gpt-5-mini \
            --expected-git-sha "$EXPECTED_GIT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --out-dir /tmp/targeted-assist-paired20
      - name: Verify production revision remained pinned
        if: always()
        run: |
          actual_git_sha="$(curl --fail --silent --show-error "$API_BASE_URL/api/v4/health" | jq -r '.deployment.git_commit_sha // empty')"
          test "$actual_git_sha" = "$EXPECTED_GIT_SHA"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: targeted-assist-paired20-evidence
          retention-days: 30
          overwrite: true
          if-no-files-found: error
          path: |
            /tmp/familiar10.json
            /tmp/familiar10-labels.jsonl
            /tmp/unseen10.json
            /tmp/unseen10-labels.jsonl
            /tmp/targeted-assist-assets.json
            /tmp/targeted-assist-asset-preparation.json
            /tmp/targeted-assist-paired-consumption.json
            /tmp/recognition-worker-service-contract.json
            /tmp/targeted-assist-paired20
