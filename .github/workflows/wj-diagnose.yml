name: wj-diagnose

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Candidate deployment origin to diagnose
        required: true
      expected_sha:
        description: Expected git sha of that deployment
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize writer journey cases
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          source_dir="$RUNNER_TEMP/wj-source"
          cases_manifest="$RUNNER_TEMP/writer-journey-cases.json"
          large_manifest="$RUNNER_TEMP/writer-journey-large.json"
          node scripts/materialize-writer-journey-source.mjs --out-dir "$source_dir" > "$cases_manifest"
          CASES_MANIFEST="$cases_manifest" LARGE_MANIFEST="$large_manifest" \
            node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const m = JSON.parse(await readFile(process.env.CASES_MANIFEST, 'utf8'));
          const v2 = { schema_version: 'writer-journey-cases-v2', evidence_scope: m.evidence_scope, accuracy_claim: null, cases: m.cases };
          await writeFile(process.env.LARGE_MANIFEST, `${JSON.stringify(v2)}\n`, { flag: 'wx', mode: 0o600 });
          NODE
          printf 'CASES_MANIFEST=%s\n' "$cases_manifest" >> "$GITHUB_ENV"
          printf 'LARGE_MANIFEST=%s\n' "$large_manifest" >> "$GITHUB_ENV"
      - name: Build large staged transport fixture
        env:
          LARGE_MANIFEST: ${{ env.LARGE_MANIFEST }}
        run: |
          fixture_parent="$RUNNER_TEMP/lynca-large-writer-fixture"
          install -d -m 700 "$fixture_parent"
          node scripts/build-large-internal-writer-fixture.mjs \
            --source-manifest "$LARGE_MANIFEST" --out-dir "$fixture_parent/bundle" >/dev/null
          printf 'LARGE_FIXTURE_RECEIPT=%s\n' "$fixture_parent/bundle/receipt.json" >> "$GITHUB_ENV"
      - name: Fetch protected candidate health into a browser storage state
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          DISPATCH_SHA: ${{ inputs.expected_sha }}
        run: |
          node scripts/fetch-vercel-protected-health.mjs \
            --storage-state "$RUNNER_TEMP/lynca-candidate-storage-state.json"
          printf 'INITIAL_STORAGE_STATE=%s\n' "$RUNNER_TEMP/lynca-candidate-storage-state.json" >> "$GITHUB_ENV"
      - name: Install pinned browser
        run: npx playwright install --with-deps chromium
      - name: Run the candidate Writer Journey with TCG resolution dump
        env:
          METAVERSE_USERNAME: ${{ secrets.METAVERSE_USERNAME }}
          METAVERSE_PASSWORD: ${{ secrets.METAVERSE_PASSWORD }}
          WRITER_JOURNEY_BASE_URL: ${{ inputs.deployment_url }}
          WRITER_JOURNEY_EXPECTED_SHA: ${{ inputs.expected_sha }}
          WRITER_JOURNEY_RELEASE_CLASS: ordinary
          WRITER_JOURNEY_CASES_MANIFEST: ${{ env.CASES_MANIFEST }}
          WRITER_JOURNEY_LARGE_FIXTURE_RECEIPT: ${{ env.LARGE_FIXTURE_RECEIPT }}
          WRITER_JOURNEY_FORWARD_READBACK_EXPECTATION: ${{ runner.temp }}/forward-readback-expectation.json
          TCG_DEBUG_DUMP: ${{ runner.temp }}/tcg-resolution-dump.json
        run: |
          npm run test:e2e:production-writer-journey || true
          cp "$TCG_DEBUG_DUMP" "$RUNNER_TEMP/tcg-resolution-dump.json" 2>/dev/null || true
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wj-diagnose
          path: |
            /home/runner/work/_temp/tcg-resolution-dump.json
            /home/runner/work/_temp/writer-journey-cases.json
            artifacts/production-writer-journey/evidence.json
            test-results/
          if-no-files-found: ignore
