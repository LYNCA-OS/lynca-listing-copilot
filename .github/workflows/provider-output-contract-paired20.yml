name: provider-output-contract-paired20

on:
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: "Exact production SHA required before paid calls"
        required: true
        type: string

concurrency:
  group: provider-output-contract-paired20
  cancel-in-progress: false

jobs:
  paired-20:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      API_BASE_URL: https://listing.lyncafei.team
      METAVERSE_USERNAME: ${{ secrets.METAVERSE_USERNAME }}
      METAVERSE_PASSWORD: ${{ secrets.METAVERSE_PASSWORD }}
      LAUNCH_GATE_EVAL_SECRET: ${{ secrets.LAUNCH_GATE_EVAL_SECRET }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_git_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact production revision and credentials
        run: |
          test -n "$METAVERSE_USERNAME"
          test -n "$METAVERSE_PASSWORD"
          test -n "$LAUNCH_GATE_EVAL_SECRET"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA"
          deployed_sha="$(curl -fsS --max-time 30 "$API_BASE_URL/api/v4/health" | jq -r '.deployment.git_commit_sha // empty')"
          test "$deployed_sha" = "$EXPECTED_GIT_SHA"
      - name: Build frozen familiar and unseen development cohorts
        run: |
          node scripts/build-reviewed-title-blind-eval.mjs \
            --source data/catalog/vector-seed/feedback-writer-gt-seed-dataset.json \
            --out /tmp/familiar10.json \
            --sealed-labels-out /tmp/familiar10-labels.jsonl \
            --limit 10 \
            --selection-seed world-knowledge-paired20-v1 \
            --sample-mode PAIRED_ABLATION \
            --reuse-reason "Frozen familiar development cohort for Provider output-contract ablation." \
            --reuse-scope-id world-knowledge-paired20-familiar-v1 \
            --evaluation-partition development
          node scripts/materialize-paired-ablation-cohort.mjs \
            --dataset data/eval/unseen-product/unseen17.json \
            --labels data/eval/unseen-product/unseen17-labels.jsonl \
            --out /tmp/unseen10.json \
            --labels-out /tmp/unseen10-labels.jsonl \
            --limit 10 \
            --reuse-reason "Frozen unseen development cohort for Provider output-contract ablation." \
            --reuse-scope-id targeted-assist-paired20-unseen-v1 \
            --evaluation-partition development
          cp data/eval/unseen-product/unseen17-verified-assets.json /tmp/provider-output-contract-assets.json
      - name: Verify frozen cohort fingerprints
        run: |
          node --input-type=module - <<'NODE'
          import { assertFrozenTargetedAssistPaired20 } from './scripts/run-targeted-assist-paired-eval.mjs';
          console.log(JSON.stringify(await assertFrozenTargetedAssistPaired20({
            familiarDataset: '/tmp/familiar10.json',
            familiarLabels: '/tmp/familiar10-labels.jsonl',
            unseenDataset: '/tmp/unseen10.json',
            unseenLabels: '/tmp/unseen10-labels.jsonl'
          }), null, 2));
          NODE
      - name: Prepare and canonically verify all 20 assets without Provider calls
        run: |
          node scripts/materialize-targeted-assist-verified-assets.mjs \
            --base-url "$API_BASE_URL" \
            --familiar-dataset /tmp/familiar10.json \
            --unseen-dataset /tmp/unseen10.json \
            --verified-asset-cache /tmp/provider-output-contract-assets.json \
            --source-materialization-dir /tmp/provider-output-contract-source-images \
            --report /tmp/provider-output-contract-asset-preparation.json
          jq -e '
            .prepared_item_count == 20 and
            .verified_cache_entry_count == 20 and
            .zero_enqueue_or_provider_calls == true and
            .all_assets_uploaded_and_canonically_verified == true
          ' /tmp/provider-output-contract-asset-preparation.json >/dev/null
      - name: Consume exact SHA once for Task A
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          consumption_ref="refs/tags/eval-provider-output-contract-${EXPECTED_GIT_SHA}"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="$consumption_ref" \
            -f sha="$EXPECTED_GIT_SHA" \
            > /tmp/provider-output-contract-consumption.json
          jq -e --arg ref "$consumption_ref" --arg sha "$EXPECTED_GIT_SHA" \
            '.ref == $ref and .object.sha == $sha' \
            /tmp/provider-output-contract-consumption.json >/dev/null
      - name: Run interleaved standard vs read-only familiar and unseen scoreboards
        run: |
          node scripts/run-provider-output-contract-paired-eval.mjs \
            --base-url "$API_BASE_URL" \
            --familiar-dataset /tmp/familiar10.json \
            --familiar-labels /tmp/familiar10-labels.jsonl \
            --unseen-dataset /tmp/unseen10.json \
            --unseen-labels /tmp/unseen10-labels.jsonl \
            --verified-asset-cache /tmp/provider-output-contract-assets.json \
            --l2-wait-ms 360000 \
            --model gpt-5-mini \
            --expected-git-sha "$EXPECTED_GIT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --out-dir /tmp/provider-output-contract-paired20
      - name: Verify production revision remained pinned
        if: always()
        run: |
          deployed_sha="$(curl -fsS --max-time 30 "$API_BASE_URL/api/v4/health" | jq -r '.deployment.git_commit_sha // empty')"
          test "$deployed_sha" = "$EXPECTED_GIT_SHA"
      - name: Upload Task A evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-output-contract-paired20-evidence
          retention-days: 30
          overwrite: true
          if-no-files-found: error
          path: |
            /tmp/familiar10.json
            /tmp/familiar10-labels.jsonl
            /tmp/unseen10.json
            /tmp/unseen10-labels.jsonl
            /tmp/provider-output-contract-assets.json
            /tmp/provider-output-contract-asset-preparation.json
            /tmp/provider-output-contract-consumption.json
            /tmp/provider-output-contract-paired20
