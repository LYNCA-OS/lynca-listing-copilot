name: Production Writer Journey

on:
  pull_request:
    paths:
      - "app/**"
      - "e2e/**"
      - "scripts/materialize-writer-journey-source.mjs"
      - "scripts/materialize-writer-journey-source.test.mjs"
      - "scripts/build-large-internal-writer-fixture.mjs"
      - "scripts/build-large-internal-writer-fixture.contract.test.mjs"
      - "scripts/build-large-internal-writer-fixture.browser.test.mjs"
      - "scripts/production-writer-journey-contract.test.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/fetch-vercel-protected-health.mjs"
      - "scripts/vercel-protected-health.test.mjs"
      - "scripts/vercel-production-rollback-receipt.mjs"
      - "scripts/vercel-production-rollback-receipt.test.mjs"
      - "scripts/production-release-boundaries.test.mjs"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/production-writer-journey.yml"

permissions:
  contents: read

concurrency:
  group: production-writer-journey
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:e2e:production-writer-journey
      - run: npm run test:e2e:production-writer-journey:contract
      - run: node scripts/production-release-boundaries.test.mjs && node scripts/vercel-protected-health.test.mjs && node scripts/vercel-production-rollback-receipt.test.mjs
      - run: npm run test:large-internal-writer-fixture:contract
      - run: npm run test:large-internal-writer-fixture:browser
      - run: npx playwright test e2e/production-writer-journey.spec.mjs --project=chromium --grep @offline
