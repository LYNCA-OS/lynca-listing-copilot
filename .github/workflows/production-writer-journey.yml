name: Production Writer Journey

on:
  pull_request:
    paths:
      - "app/**"
      - "e2e/**"
      - "scripts/materialize-writer-journey-source.mjs"
      - "scripts/materialize-writer-journey-source.test.mjs"
      - "scripts/production-writer-journey-contract.test.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-writer-journey.yml"
  workflow_run:
    workflows: ["deploy-production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-writer-journey
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:e2e:production-writer-journey
      - run: npm run test:e2e:production-writer-journey:contract

  writer-journey:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      WRITER_JOURNEY_BASE_URL: https://listing.lyncafei.team
      WRITER_JOURNEY_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      METAVERSE_USERNAME: ${{ secrets.METAVERSE_USERNAME }}
      METAVERSE_PASSWORD: ${{ secrets.METAVERSE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Fail closed unless the successful deploy was exact current main
        env:
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$UPSTREAM_EVENT" = "workflow_dispatch"
          test "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$UPSTREAM_BRANCH" = "main"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$UPSTREAM_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assert scoped production credentials
        run: test -n "$METAVERSE_USERNAME" && test -n "$METAVERSE_PASSWORD"
      - name: Materialize one internal source directly from Production Storage
        id: source
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          source_dir="$RUNNER_TEMP/writer-journey-source"
          source_json="$RUNNER_TEMP/writer-journey-source.json"
          node scripts/materialize-writer-journey-source.mjs --out-dir "$source_dir" > "$source_json"
          local_images="$(node -e 'const x=require(process.argv[1]); process.stdout.write(x.files.map((f)=>f.path).join(","))' "$source_json")"
          test -n "$local_images"
          echo "local_images=$local_images" >> "$GITHUB_OUTPUT"
      - run: npx playwright install --with-deps chromium
      - name: Run real production Writer Journey
        env:
          WRITER_JOURNEY_LOCAL_IMAGES: ${{ steps.source.outputs.local_images }}
        run: npm run test:e2e:production-writer-journey
      - name: Upload passing evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-writer-journey-evidence
          path: artifacts/production-writer-journey/evidence.json
          retention-days: 14
      - name: Upload failure evidence without browser credentials or image bytes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-writer-journey-failure
          path: artifacts/production-writer-journey/evidence.json
          retention-days: 14
