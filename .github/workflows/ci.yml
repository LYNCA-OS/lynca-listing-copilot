name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: |
          npm ls --omit=dev --all
          node scripts/npm-audit-gate.mjs
      - name: Run offline test suites
        # Every scripts/**/*.test.mjs runs with no credentials; suites that
        # need runtime credentials are excluded explicitly below.
        #
        # `artifacts/` is gitignored, so a suite that reads an evaluation
        # checkpoint has no input on a runner and can NEVER pass here. Twenty
        # such suites turned this job permanently red, which is worse than not
        # running them: a job that is always failing is a job nobody reads, and
        # a real regression hides in the noise.
        #
        # They are classified rather than listed. A hand-written exclusion list
        # goes stale the first time someone adds a suite, and the ones it misses
        # are exactly the ones nobody remembers. A failure is a SKIP only when
        # the process died reaching for a missing path under `artifacts/`; an
        # assertion failure in the same suite still fails the job, so this
        # cannot quietly swallow a regression.
        run: |
          set -u
          pass=0; fail=0; skip=0; failed_list=""; skipped_list=""
          for t in scripts/*.test.mjs scripts/data-loop/*.test.mjs; do
            if node "$t" >/tmp/test-out.log 2>&1; then
              pass=$((pass+1))
            elif grep -qE "ENOENT.*artifacts/" /tmp/test-out.log; then
              skip=$((skip+1)); skipped_list="$skipped_list $t"
              echo "::notice::SKIP $t (reads a gitignored evaluation artifact)"
            elif grep -qE "(ENOENT|ERR_MODULE_NOT_FOUND).*'?/(Users|Volumes)/" /tmp/test-out.log; then
              # Several evaluation scripts default to a SIBLING repository,
              # `/Users/paidaxin/lynca-eval-root`, which holds the reviewed
              # corpus. Like the artifacts above, it is not on a runner and
              # never will be. Reaching outside the checkout is the signal.
              skip=$((skip+1)); skipped_list="$skipped_list $t"
              echo "::notice::SKIP $t (reaches outside the checkout)"
            else
              fail=$((fail+1)); failed_list="$failed_list $t"
              echo "::error::FAIL $t"
              tail -30 /tmp/test-out.log
            fi
          done
          echo "PASS=$pass FAIL=$fail SKIP=$skip"
          [ -n "$skipped_list" ] && echo "::warning::skipped for missing artifacts:$skipped_list"
          [ "$fail" -eq 0 ]
      - name: Syntax-check API handlers and app bundle
        run: |
          set -e
          for f in api/*.js api/v4/*.js app/*.js; do
            node --check "$f"
          done
      - name: Validate launch benchmark contracts
        run: |
          npm run check:launch-benchmark
          npm run test:launch-benchmark
