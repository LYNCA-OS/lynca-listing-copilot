name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Keep only candidate + direct parent; older release objects are pinned below.
          fetch-depth: 2
      - name: Fetch the exact immutable release lineage objects
        run: |
          failed_v4_sha=d11830049cf7e19016844dbb44ee30178f8ee925
          failed_v4_ref=refs/heads/lynca-failed-v4-verifier
          activation_v4_sha=2edf243fb8841e2e04ffff64b9b8ddf4722d0efa
          activation_v4_ref=refs/heads/lynca-tcg-v4-activation
          rollback_v4_sha=85ecd6ebfd032f47e8884579c4fb87ddf121aa16
          rollback_v4_ref=refs/heads/lynca-tcg-v4-rollback
          historical_v42_sha=20298d18ea540a7dd5a660458a1cb9646ba65342
          historical_v42_ref=refs/heads/lynca-historical-v42
          git fetch --no-tags --refetch --depth=1 origin \
            "$failed_v4_sha:$failed_v4_ref" \
            "$activation_v4_sha:$activation_v4_ref" \
            "$rollback_v4_sha:$rollback_v4_ref" \
            "$historical_v42_sha:$historical_v42_ref"
          test "$(git rev-parse "$failed_v4_ref")" = "$failed_v4_sha"
          test "$(git cat-file -t "$failed_v4_sha")" = "commit"
          test "$(git rev-parse "$failed_v4_sha^{tree}")" = \
            "6cfac615bf282537f7ae7ae81e20e4441ad6de5f"
          test "$(git rev-parse "$activation_v4_ref")" = "$activation_v4_sha"
          test "$(git cat-file -t "$activation_v4_sha")" = "commit"
          test "$(git rev-parse "$activation_v4_sha^{tree}")" = \
            "afb54d691df67628b9c92d1d14f6cd20fddca8a3"
          test "$(git rev-parse "$rollback_v4_ref")" = "$rollback_v4_sha"
          test "$(git cat-file -t "$rollback_v4_sha")" = "commit"
          test "$(git rev-parse "$rollback_v4_sha^{tree}")" = \
            "66bc3bdafd5d3db9db278b16f79a3907c332c017"
          test "$(git rev-parse "$historical_v42_ref")" = "$historical_v42_sha"
          test "$(git cat-file -t "$historical_v42_sha")" = "commit"
          test "$(git rev-parse "$historical_v42_sha^{tree}")" = \
            "ec560447430bb2ba8206dc1282e514fe41ee7e7c"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: |
          npm ls --omit=dev --all
          node scripts/npm-audit-gate.mjs
      - name: Install PostgreSQL 17 from the official PGDG repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
      - name: Put PostgreSQL on PATH
        # The two CSM postgres suites exit 0 when initdb/pg_ctl are missing, so
        # on a runner without them they reported PASS while testing nothing.
        # That is how a persistence defect survived: `buildCsmStageRows` wrote an
        # `evidence` key that `csm_marketplace_structured_check` forbids, which
        # would have failed every atomic write, and the only suite covering it
        # skipped here and could not start a server locally either. A gate that
        # cannot fail is not a gate.
        #
        # Pin the exact major installed above. Selecting the newest runner
        # version would silently change the persistence test environment.
        run: |
          pg_bin=/usr/lib/postgresql/17/bin
          for binary in initdb pg_ctl psql postgres; do
            if [ ! -x "$pg_bin/$binary" ]; then
              echo "::error::missing PostgreSQL 17 binary: $binary"
              exit 1
            fi
          done
          if ! "$pg_bin/postgres" --version | grep -Eq '^postgres \(PostgreSQL\) 17\.'; then
            echo "::error::PostgreSQL 17 version check failed"
            exit 1
          fi
          echo "$pg_bin" >> "$GITHUB_PATH"
          echo "PostgreSQL on PATH: $pg_bin"

      - name: Check the production import graph and contracts
        run: npm run check
      - name: Run the retained thin-path and production suites
        run: npm run test:release
      - name: Syntax-check API handlers and app bundle
        run: |
          set -e
          for f in api/*.js api/v4/*.js app/*.js; do
            node --check "$f"
          done
      - name: Install Playwright Chromium for the credential-free browser gates
        # The renderer and batch-navigation specs exercise real DOM wiring
        # (drag-drop dispatch, bounded windows, preparation-failure states).
        # Until 2026-08-16 CI only syntax-checked them, so a broken DOM
        # contract could merge on green.
        run: npx playwright install --with-deps chromium
      - name: Run the credential-free browser regression gates
        run: |
          npm run test:e2e:batch-navigation
          npm run test:e2e:writer-terminal-renderer
