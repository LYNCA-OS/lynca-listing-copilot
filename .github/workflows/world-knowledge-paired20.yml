name: world-knowledge-paired-canary

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: "Run one 10-card development cohort, or both only when explicitly authorized"
        required: true
        default: familiar
        type: choice
        options:
          - familiar
          - unseen
          - both
      limit:
        description: "Unique cards per selected cohort (hard maximum 10)"
        required: true
        default: 10
        type: number
      expected_git_sha:
        description: "Exact production SHA required before paid calls"
        required: true
        type: string

concurrency:
  group: world-knowledge-paired-canary
  cancel-in-progress: false

jobs:
  paired-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      API_BASE_URL: https://listing.lyncafei.team
      METAVERSE_USERNAME: ${{ secrets.METAVERSE_USERNAME }}
      METAVERSE_PASSWORD: ${{ secrets.METAVERSE_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CANARY_COHORT: ${{ inputs.cohort }}
      CANARY_LIMIT: ${{ inputs.limit }}
      EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify hosted credentials
        run: |
          test -n "$METAVERSE_USERNAME"
          test -n "$METAVERSE_PASSWORD"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Verify canary budget and exact production
        run: |
          test "$CANARY_LIMIT" -ge 1
          test "$CANARY_LIMIT" -le 10
          test -n "$EXPECTED_GIT_SHA"
          actual_git_sha="$(curl --fail --silent --show-error "$API_BASE_URL/api/v4/health" | jq -r '.deployment.git_commit_sha // empty')"
          test "$actual_git_sha" = "$EXPECTED_GIT_SHA"
      - name: Verify authenticated Recognition Worker capability
        run: |
          curl -fsS --max-time 30 -c /tmp/lynca-cookies.txt \
            -H 'content-type: application/json' \
            --data "$(node -e 'process.stdout.write(JSON.stringify({username:process.env.METAVERSE_USERNAME,password:process.env.METAVERSE_PASSWORD}))')" \
            "$API_BASE_URL/api/login" -o /tmp/login.json
          curl -fsS --max-time 30 -b /tmp/lynca-cookies.txt \
            "$API_BASE_URL/api/listing-provider-status" \
            -o /tmp/recognition-worker-capability.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { recognitionPipelineVersion } from './lib/listing/recognition/recognition-contract.mjs';
          const status = JSON.parse(fs.readFileSync('/tmp/recognition-worker-capability.json', 'utf8'));
          const worker = status.execution_control?.recognition_worker || {};
          const checks = {
            runtime_ready: worker.runtime_ready === true,
            contract_matches: worker.contract_matches === true,
            auth_verified: worker.auth_verified === true,
            analysis_route_verified: worker.analysis_route_verified === true,
            pipeline_version: worker.pipeline_version === recognitionPipelineVersion,
            service_role: worker.service_role === 'RECOGNITION_WORKER'
          };
          console.log(JSON.stringify({ checks, reason: worker.reason || null }, null, 2));
          if (Object.values(checks).some((value) => value !== true)) process.exit(1);
          NODE
      - name: Build frozen familiar 10
        if: ${{ inputs.cohort != 'unseen' }}
        run: |
          node scripts/build-reviewed-title-blind-eval.mjs \
            --source data/catalog/vector-seed/feedback-writer-gt-seed-dataset.json \
            --out /tmp/familiar10.json \
            --sealed-labels-out /tmp/familiar10-labels.jsonl \
            --limit "$CANARY_LIMIT" \
            --selection-seed world-knowledge-paired20-v1 \
            --sample-mode PAIRED_ABLATION \
            --reuse-reason "Frozen familiar cohort for paired world-knowledge ablation." \
            --reuse-scope-id world-knowledge-paired20-familiar-v1
      - name: Paired familiar 10
        if: ${{ inputs.cohort != 'unseen' }}
        run: |
          node scripts/run-paired-eval.mjs \
            --baseline-url "$API_BASE_URL" \
            --candidate-url "$API_BASE_URL" \
            --rounds 1 \
            --report-only \
            --dataset /tmp/familiar10.json \
            --sealed-labels /tmp/familiar10-labels.jsonl \
            --limit "$CANARY_LIMIT" \
            --l2-wait-ms 360000 \
            --both-read-only-provider-contract \
            --candidate-world-knowledge-proposals \
            --verified-asset-cache /tmp/familiar10-assets.json \
            --verified-asset-cache-mode reuse \
            --out-dir /tmp/world-knowledge-paired20 \
            --label familiar
      - name: Paired unseen 10
        if: ${{ inputs.cohort != 'familiar' }}
        run: |
          node scripts/run-paired-eval.mjs \
            --baseline-url "$API_BASE_URL" \
            --candidate-url "$API_BASE_URL" \
            --rounds 1 \
            --report-only \
            --dataset data/eval/unseen-product/unseen17.json \
            --sealed-labels data/eval/unseen-product/unseen17-labels.jsonl \
            --limit "$CANARY_LIMIT" \
            --l2-wait-ms 360000 \
            --both-read-only-provider-contract \
            --candidate-world-knowledge-proposals \
            --verified-asset-cache data/eval/unseen-product/unseen17-verified-assets.json \
            --verified-asset-cache-mode reuse \
            --out-dir /tmp/world-knowledge-paired20 \
            --label unseen
      - name: Summarize both scoreboards
        if: ${{ always() && inputs.cohort == 'both' }}
        run: |
          test -f /tmp/world-knowledge-paired20/familiar-baseline-r1.json
          test -f /tmp/world-knowledge-paired20/familiar-candidate-r1.json
          test -f /tmp/world-knowledge-paired20/unseen-baseline-r1.json
          test -f /tmp/world-knowledge-paired20/unseen-candidate-r1.json
          node scripts/summarize-world-knowledge-paired-eval.mjs \
            --familiar-baseline /tmp/world-knowledge-paired20/familiar-baseline-r1.json \
            --familiar-candidate /tmp/world-knowledge-paired20/familiar-candidate-r1.json \
            --unseen-baseline /tmp/world-knowledge-paired20/unseen-baseline-r1.json \
            --unseen-candidate /tmp/world-knowledge-paired20/unseen-candidate-r1.json \
            --out /tmp/world-knowledge-paired20/summary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-knowledge-paired20-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/familiar10.json
            /tmp/familiar10-labels.jsonl
            /tmp/recognition-worker-capability.json
            /tmp/world-knowledge-paired20
